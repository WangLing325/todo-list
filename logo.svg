<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="To-Do List Trong Ngày">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e88e5"/>
      <stop offset="1" stop-color="#0b3d75"/>
    </linearGradient>
  </defs>
  <!-- Nền xanh nước biển bo góc -->
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <!-- Núm bấm đồng hồ bấm giờ -->
  <rect x="27" y="6" width="10" height="5" rx="2" fill="#ffffff"/>
  <rect x="30.5" y="10" width="3" height="5" fill="#ffffff"/>
  <!-- Mặt đồng hồ, chừa khe để dấu tích vươn ra -->
  <path d="M48.9 26.8 A18 18 0 1 1 41 17.4" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <!-- Dấu tích hoàn thành -->
  <polyline points="23,33 31,41 50,18" fill="none" stroke="#7dd3fc" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
